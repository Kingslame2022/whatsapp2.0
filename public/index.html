<!-- language: HTML/CSS/JS, file: public/index.html, target: mobile + desktop -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhatsApp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, 'SF Pro Text', 'Roboto', 'Helvetica Neue', Arial, sans-serif; background: #000; }
  :root {
    --wa-green: #075e54;
    --wa-green-dark: #054d44;
    --wa-green-light: #128c7e;
    --wa-bubble-out: #dcf8c6;
    --wa-bubble-in: #ffffff;
    --wa-bg: #ece5dd;
    --wa-text: #111;
    --wa-meta: #667781;
    --wa-divider: #d9d9d9;
    --wa-surface: #ffffff;
    --wa-surface-text: #111;
    --wa-surface-sub: #667781;
    --wa-surface-border: #e9edef;
  }
  body { display: flex; justify-content: center; background: #111; }
  .app {
    width: 100%; max-width: 480px; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--wa-bg); position: relative; overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,.6);
  }
  @media (min-width: 768px) { .app { max-width: 900px; } }

  header { background: var(--wa-green); color: #fff; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 500; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.2); z-index: 10; }
  header .back { background: transparent; border: 0; color: #fff; font-size: 22px; cursor: pointer; padding: 0 6px 0 0; line-height: 1; }
  header .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--wa-green-light); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; overflow: hidden; }
  header .avatar img { width: 100%; height: 100%; object-fit: cover; }
  header .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .title .sub { font-size: 11px; opacity: .85; font-weight: 400; }
  header .actions { display: flex; gap: 4px; }
  header .actions button { background: transparent; border: 0; color: #fff; font-size: 20px; cursor: pointer; padding: 4px 8px; line-height: 1; }

  .auth { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; background: #fff; overflow-y: auto; }
  .auth .logo { width: 72px; height: 72px; border-radius: 50%; background: var(--wa-green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 16px; }
  .auth h1 { color: var(--wa-green); font-size: 24px; margin-bottom: 6px; }
  .auth .sub { color: var(--wa-meta); font-size: 13px; margin-bottom: 24px; line-height: 1.4; }
  .auth .tabs { display: flex; gap: 0; margin-bottom: 20px; border: 1px solid var(--wa-green); border-radius: 4px; overflow: hidden; }
  .auth .tabs button { background: #fff; color: var(--wa-green); border: 0; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .auth .tabs button.active { background: var(--wa-green); color: #fff; }
  .auth .label { color: var(--wa-meta); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; align-self: flex-start; }
  .auth .num { font-size: 22px; font-weight: 700; color: var(--wa-text); padding: 14px 22px; background: #f7f7f7; border: 1px solid var(--wa-divider); border-radius: 6px; margin-bottom: 10px; letter-spacing: 1px; font-family: 'Courier New', monospace; width: 100%; text-align: center; }
  .auth .tier-badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 10px; margin-bottom: 10px; font-weight: 600; letter-spacing: .3px; }
  .auth .tier-clean { background: #fff3c4; color: #8a6d00; }
  .auth .tier-half { background: #e0f2f1; color: #00695c; }
  .auth input[type=text], .auth input[type=password], .auth input[type=tel] { width: 100%; padding: 12px 14px; border: 1px solid var(--wa-divider); border-radius: 4px; font-size: 15px; outline: none; margin-bottom: 10px; }
  .auth input:focus { border-color: var(--wa-green); }
  .auth .full { width: 100%; }
  .btn { background: var(--wa-green); color: #fff; border: 0; padding: 12px 22px; border-radius: 4px; font-size: 15px; cursor: pointer; margin: 4px; font-weight: 500; letter-spacing: .3px; transition: background .15s; }
  .btn.secondary { background: var(--wa-green-light); }
  .btn:active { background: var(--wa-green-dark); }
  .btn:disabled { background: #999; cursor: not-allowed; }
  .btn.full { width: 100%; margin: 4px 0; }
  .btn-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .hint { color: var(--wa-meta); font-size: 12px; margin-top: 10px; line-height: 1.5; }
  .owner-link { color: var(--wa-meta); font-size: 11px; margin-top: 24px; text-decoration: underline; cursor: pointer; }

  .banned-screen { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; color: #fff; justify-content: center; align-items: center; padding: 32px 24px; text-align: center; }
  .banned-screen .icon { width: 88px; height: 88px; border-radius: 50%; background: #3a1010; color: #ff6b6b; display: flex; align-items: center; justify-content: center; font-size: 42px; margin-bottom: 26px; border: 2px solid #4a1818; }
  .banned-screen h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; letter-spacing: .3px; }
  .banned-screen .num { font-family: 'Courier New', monospace; font-size: 17px; color: #8e8e93; margin-bottom: 24px; padding: 8px 16px; background: #1c1c1e; border-radius: 8px; }
  .banned-screen .msg { font-size: 14.5px; line-height: 1.6; color: #b0b0b0; max-width: 340px; margin-bottom: 28px; }
  .banned-screen .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
  .banned-screen .status-badge.pending { background: #3a2f0a; color: #ffa726; }
  .banned-screen .status-badge.approved { background: #0f2a14; color: #4caf50; }
  .banned-screen .status-badge.denied { background: #3a1010; color: #ff6b6b; }
  .banned-screen .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  .banned-screen .actions button { width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: 0; letter-spacing: .3px; }
  .banned-screen .actions .primary { background: #25d366; color: #000; }
  .banned-screen .actions .primary:disabled { background: #3a3a3c; color: #8e8e93; cursor: not-allowed; }
  .banned-screen .actions .secondary { background: transparent; color: #8e8e93; border: 1px solid #3a3a3c; }
  .banned-screen .actions .success { background: #2e7d32; color: #fff; }
  .banned-screen .actions button:active { transform: scale(.98); }

  .chatlist-wrap { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .chatlist { flex: 1; overflow-y: auto; background: var(--wa-surface); }
  .chatlist .empty { padding: 60px 30px; text-align: center; color: var(--wa-surface-sub); font-size: 14px; line-height: 1.6; }
  .chatlist .empty .icon { font-size: 48px; opacity: .3; margin-bottom: 12px; }
  .chatitem { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--wa-surface-border); cursor: pointer; background: var(--wa-surface); }
  .chatitem:active { background: rgba(0,0,0,.05); }
  .chatitem .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--wa-green-light); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; overflow: hidden; }
  .chatitem .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chatitem .info { flex: 1; min-width: 0; }
  .chatitem .name { font-weight: 500; color: var(--wa-surface-text); font-size: 15px; margin-bottom: 2px; }
  .chatitem .preview { color: var(--wa-surface-sub); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatitem .meta { color: var(--wa-surface-sub); font-size: 11px; text-align: right; flex-shrink: 0; }

  .fab {
    position: absolute;
    left: 16px; bottom: 16px;
    width: 56px; height: 56px; border-radius: 50%;
    background: #25d366; color: #fff;
    border: 0; font-size: 30px; line-height: 1;
    cursor: pointer; z-index: 20;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s;
  }
  .fab:active { transform: scale(.94); }

  .chatview { flex: 1; display: flex; flex-direction: column; background: var(--wa-bg); overflow: hidden; }
  .messages {
    flex: 1; overflow-y: auto; padding: 10px 8px;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.18) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.18) 0%, transparent 40%),
      var(--wa-bg);
  }
  .msg { max-width: 78%; padding: 6px 9px 5px; margin-bottom: 4px; border-radius: 7px; font-size: 14.5px; line-height: 1.35; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,.13); animation: pop .12s ease-out; }
  @keyframes pop { from { transform: scale(.96); opacity: .6; } to { transform: scale(1); opacity: 1; } }
  .msg.out { background: var(--wa-bubble-out); margin-left: auto; border-top-right-radius: 0; color: var(--wa-text); }
  .msg.in  { background: var(--wa-bubble-in); margin-right: auto; border-top-left-radius: 0; color: var(--wa-text); }
  .msg .time { font-size: 10.5px; color: var(--wa-meta); text-align: right; margin-top: 2px; }
  .msg .tick { color: #4fc3f7; margin-left: 3px; }
  .msg.image { padding: 4px 4px 2px; }
  .msg.image img { display: block; max-width: 100%; width: 240px; border-radius: 5px; cursor: pointer; }
  .msg.image .time { padding-right: 4px; }
  .composer { display: flex; gap: 6px; padding: 6px 8px; background: #f0f0f0; border-top: 1px solid #ddd; flex-shrink: 0; align-items: flex-end; }
  .composer input[type=text] { flex: 1; padding: 10px 14px; border: 0; border-radius: 18px; font-size: 15px; outline: none; background: #fff; }
  .composer .attach { background: transparent; color: #667781; border: 0; font-size: 22px; cursor: pointer; padding: 4px 6px; line-height: 1; }
  .composer .send { background: var(--wa-green); color: #fff; border: 0; border-radius: 50%; width: 40px; height: 40px; font-size: 17px; cursor: pointer; flex-shrink: 0; }

  .settings { flex: 1; overflow-y: auto; background: #fff; }
  .settings .section { padding: 20px 16px; border-bottom: 1px solid #eee; }
  .settings .section h3 { color: var(--wa-green); font-size: 13px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; font-weight: 600; }
  .settings .profile-row { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .settings .profile-pic { width: 72px; height: 72px; border-radius: 50%; background: var(--wa-green-light); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px; flex-shrink: 0; cursor: pointer; overflow: hidden; position: relative; }
  .settings .profile-pic img { width: 100%; height: 100%; object-fit: cover; }
  .settings .profile-pic .cam { position: absolute; bottom: 0; right: 0; background: var(--wa-green); width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; border: 2px solid #fff; }
  .settings .field { margin-bottom: 14px; }
  .settings .field label { display: block; color: var(--wa-meta); font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
  .settings .field input, .settings .field .value { width: 100%; padding: 10px 12px; border: 1px solid var(--wa-divider); border-radius: 4px; font-size: 15px; outline: none; background: #fff; color: var(--wa-text); }
  .settings .field input:focus { border-color: var(--wa-green); }
  .settings .field .value { font-family: 'Courier New', monospace; font-weight: 700; background: #f7f7f7; color: var(--wa-green-dark); }
  .settings .hint { color: var(--wa-meta); font-size: 12px; margin-top: 8px; line-height: 1.5; }

  .check-screen { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; color: #fff; overflow: hidden; }
  .check-screen .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; flex-shrink: 0; font-size: 17px; background: #0a0a0a; }
  .check-screen .topbar .cancel { color: #fff; background: transparent; border: 0; font-size: 17px; cursor: pointer; padding: 0; }
  .check-screen .topbar .title { color: #8e8e93; font-weight: 500; }
  .check-screen .topbar .action { background: transparent; border: 0; color: #25d366; font-size: 17px; font-weight: 500; cursor: pointer; padding: 0; }
  .check-screen .topbar .action:disabled { color: #3a3a3c; cursor: not-allowed; }
  .check-screen .body { flex: 1; overflow-y: auto; padding: 4px 16px 30px; }
  .check-screen .section-label { color: #8e8e93; font-size: 14px; margin: 18px 0 10px; font-weight: 400; }
  .check-screen .country-row { display: flex; align-items: center; justify-content: space-between; background: #1c1c1e; padding: 14px 16px; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 17px; }
  .check-screen .country-row.readonly { cursor: default; }
  .check-screen .country-row .chev { color: #8e8e93; font-size: 18px; }
  .check-screen .number-row { display: flex; align-items: center; gap: 12px; background: #1c1c1e; padding: 14px 16px; border-radius: 0 0 10px 10px; border-top: 1px solid #2c2c2e; font-size: 17px; }
  .check-screen .number-row .prefix { color: #8e8e93; font-family: 'Courier New', monospace; }
  .check-screen .number-row input { flex: 1; background: transparent; border: 0; outline: none; color: #fff; font-size: 17px; font-family: 'Courier New', monospace; letter-spacing: .5px; }
  .check-screen .number-row input::placeholder { color: #48484a; }
  .check-screen .number-row .display { color: #fff; font-family: 'Courier New', monospace; letter-spacing: .5px; }

  .country-picker { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 250; }
  .country-picker .sheet { background: #1c1c1e; width: 100%; max-width: 480px; max-height: 70vh; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; overflow: hidden; color: #fff; }
  .country-picker .sheet h3 { padding: 16px; text-align: center; color: #8e8e93; font-size: 14px; font-weight: 500; border-bottom: 1px solid #2c2c2e; }
  .country-picker .sheet .list { overflow-y: auto; flex: 1; }
  .country-picker .sheet .item { padding: 16px; border-bottom: 1px solid #2c2c2e; cursor: pointer; font-size: 16px; display: flex; justify-content: space-between; }
  .country-picker .sheet .item:active { background: #2c2c2e; }
  .country-picker .sheet .item .code { color: #8e8e93; font-family: 'Courier New', monospace; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal .box { background: #fff; border-radius: 6px; padding: 22px; max-width: 360px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.3); max-height: 80vh; overflow-y: auto; }
  .modal .box h2 { color: var(--wa-green); margin-bottom: 10px; font-size: 17px; font-weight: 600; }
  .modal .box p { color: var(--wa-text); margin-bottom: 16px; line-height: 1.5; font-size: 14px; }
  .modal .box input, .modal .box textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--wa-divider); border-radius: 4px; font-size: 15px; margin-bottom: 12px; outline: none; font-family: inherit; }
  .modal .box textarea { min-height: 70px; resize: vertical; }
  .modal .box input:focus, .modal .box textarea:focus { border-color: var(--wa-green); }
  .modal .box .row { display: flex; gap: 8px; justify-content: flex-end; }
  .modal .box .row button { padding: 9px 16px; border: 0; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: 500; }
  .modal .box .row .cancel { background: #eee; color: #333; }
  .modal .box .row .ok { background: var(--wa-green); color: #fff; }
  .modal .contact-item { padding: 10px 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .modal .contact-item:active { background: #f5f5f5; }
  .modal .contact-item .cname { font-weight: 500; font-size: 14px; color: var(--wa-text); }
  .modal .contact-item .cnum { font-size: 12px; color: var(--wa-meta); font-family: 'Courier New', monospace; }
  .modal .contact-list { max-height: 240px; overflow-y: auto; margin-bottom: 12px; border: 1px solid var(--wa-divider); border-radius: 4px; }

  /* ---------- Info-Modal (Ban / Locked / Unlocked) ---------- */
  .info-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; padding: 24px;
    animation: fade .18s ease-out;
  }
  .info-modal {
    background: #2c2c2e;
    border-radius: 14px;
    width: 100%;
    max-width: 282px;
    overflow: hidden;
    box-shadow: 0 14px 50px rgba(0,0,0,.6);
    animation: modalIn .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.9); }
    to   { opacity: 1; transform: scale(1); }
  }
  .info-modal .body {
    padding: 26px 20px 24px;
    color: #f2f2f7;
    text-align: center;
    font-size: 15px;
    line-height: 1.45;
    font-weight: 400;
    letter-spacing: -0.01em;
    word-wrap: break-word;
  }
  .info-modal .body .num-line {
    display: block;
    font-weight: 600;
    font-size: 15px;
    margin: 3px 0;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  .info-modal .body .icon-line {
    display: block;
    font-size: 34px;
    line-height: 1;
    margin-bottom: 14px;
  }
  .info-modal .actions { display: flex; }
  .info-modal .actions button {
    flex: 1;
    background: transparent;
    border: 0;
    color: #25d366;
    padding: 15px 12px;
    font-size: 15px;
    font-weight: 400;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: background .12s;
  }
  .info-modal .actions button:not(:last-child) { border-right: 1px solid #3a3a3c; }
  .info-modal .actions button:active { background: rgba(255,255,255,.06); }

  /* Lightbox für Bild */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 500; padding: 20px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 400; animation: toastIn .2s ease-out; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .owner-panel { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; color: #fff; overflow: hidden; }
  .owner-panel .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #2c2c2e; flex-shrink: 0; }
  .owner-panel .topbar .title { font-size: 17px; font-weight: 600; }
  .owner-panel .topbar button { background: transparent; border: 0; color: #ff6b6b; font-size: 14px; cursor: pointer; }
  .owner-panel .tabs { display: flex; border-bottom: 1px solid #2c2c2e; flex-shrink: 0; }
  .owner-panel .tabs button { flex: 1; background: transparent; border: 0; color: #8e8e93; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
  .owner-panel .tabs button.active { color: #25d366; border-bottom-color: #25d366; }
  .owner-panel .list { flex: 1; overflow-y: auto; padding: 12px; }
  .owner-panel .report-card { background: #1c1c1e; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .owner-panel .report-card .meta-row { font-size: 12px; color: #8e8e93; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .owner-panel .report-card .target { font-size: 15px; font-family: 'Courier New', monospace; font-weight: 600; margin-bottom: 4px; }
  .owner-panel .report-card .reason { font-size: 13px; color: #d1d1d6; margin-bottom: 12px; }
  .owner-panel .report-card .actions { display: flex; gap: 8px; }
  .owner-panel .report-card .actions button { flex: 1; padding: 9px 12px; border: 0; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .owner-panel .report-card .actions .lock { background: #c62828; color: #fff; }
  .owner-panel .report-card .actions .unlock { background: #2e7d32; color: #fff; }
  .owner-panel .report-card .actions .dismiss { background: #3a3a3c; color: #fff; }
  .owner-panel .report-card .status { font-size: 11px; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-top: 8px; }
  .owner-panel .report-card .status.pending { background: #3a2f0a; color: #ffa726; }
  .owner-panel .report-card .status.locked { background: #3a1010; color: #ff6b6b; }
  .owner-panel .report-card .status.unlocked { background: #0f2a14; color: #4caf50; }
  .owner-panel .report-card .status.dismissed { background: #2c2c2e; color: #8e8e93; }
  .owner-panel .report-card .status.approved { background: #0f2a14; color: #4caf50; }
  .owner-panel .report-card .status.denied { background: #3a1010; color: #ff6b6b; }
  .owner-panel .empty { padding: 60px 30px; text-align: center; color: #8e8e93; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
// ---------- State ----------
let token = localStorage.getItem('oldwhats_token') || null;
let ownerToken = localStorage.getItem('oldwhats_ownertoken') || null;
let me = null;
let profile = null;
let socket = null;
let currentPeer = null;
let chatMessages = {};
let peerProfiles = {};
let contacts = {};
let bannedPollTimer = null;
let lastLockedNum = null;

function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, Object.assign({}, opts, { headers })).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (r.status === 403 && data.error === 'locked') handleLocked();
      throw Object.assign(new Error(data.error || ('http_' + r.status)), { status: r.status, data });
    }
    return data;
  });
}

function ownerApi(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (ownerToken) headers['Authorization'] = 'Bearer ' + ownerToken;
  return fetch(path, Object.assign({}, opts, { headers })).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.error || ('http_' + r.status)), { status: r.status, data });
    return data;
  });
}

// ---------- Helpers ----------
function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'onclick') e.onclick = v;
    else if (k === 'onkeydown') e.onkeydown = v;
    else if (k === 'oninput') e.oninput = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('data-')) e.setAttribute(k, v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}
function fmtTime(ts) { const d = new Date(ts); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }
function fmtDate(ts) { const d = new Date(ts); return d.toLocaleDateString() + ' ' + fmtTime(ts); }
function toast(msg) { const t = el('div', { class: 'toast' }, msg); document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function avatarFor(label, size, pic) {
  const div = el('div', { class: 'avatar', style: `width:${size}px;height:${size}px;font-size:${Math.round(size*0.35)}px` });
  if (pic) div.appendChild(el('img', { src: pic, alt: '' }));
  else div.textContent = (label || '').replace(/[^\d]/g, '').slice(-2) || '??';
  return div;
}

// ---------- Color utils ----------
function hexToRgb(hex) {
  const h = (hex || '').replace('#', '');
  if (h.length === 3) return { r: parseInt(h[0]+h[0],16), g: parseInt(h[1]+h[1],16), b: parseInt(h[2]+h[2],16) };
  if (h.length !== 6) return null;
  return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
}
function hexShade(hex, percent) {
  const rgb = hexToRgb(hex);
  if (!rgb) return hex;
  let r = Math.max(0, Math.min(255, rgb.r + Math.round(255 * percent / 100)));
  let g = Math.max(0, Math.min(255, rgb.g + Math.round(255 * percent / 100)));
  let b = Math.max(0, Math.min(255, rgb.b + Math.round(255 * percent / 100)));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
function isLight(hex) {
  const rgb = hexToRgb(hex);
  if (!rgb) return true;
  const lum = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
  return lum > 155;
}

// ---------- Theme ----------
function applyTheme(theme) {
  const root = document.documentElement;
  const t = theme || {};
  if (t.bg) root.style.setProperty('--wa-bg', t.bg);
  else      root.style.removeProperty('--wa-bg');
  if (t.btn) {
    root.style.setProperty('--wa-green', t.btn);
    root.style.setProperty('--wa-green-dark', hexShade(t.btn, -18));
    root.style.setProperty('--wa-green-light', hexShade(t.btn, 15));
  } else {
    root.style.removeProperty('--wa-green');
    root.style.removeProperty('--wa-green-dark');
    root.style.removeProperty('--wa-green-light');
  }
  if (t.bubbleOut) root.style.setProperty('--wa-bubble-out', t.bubbleOut);
  else             root.style.removeProperty('--wa-bubble-out');
  if (t.bubbleIn)  root.style.setProperty('--wa-bubble-in', t.bubbleIn);
  else             root.style.removeProperty('--wa-bubble-in');
  if (t.surface) {
    root.style.setProperty('--wa-surface', t.surface);
    const light = isLight(t.surface);
    root.style.setProperty('--wa-surface-text', light ? '#111' : '#f5f5f5');
    root.style.setProperty('--wa-surface-sub',  light ? '#667781' : '#a0a0a8');
    root.style.setProperty('--wa-surface-border', light ? '#e9edef' : 'rgba(255,255,255,.08)');
  } else {
    root.style.removeProperty('--wa-surface');
    root.style.removeProperty('--wa-surface-text');
    root.style.removeProperty('--wa-surface-sub');
    root.style.removeProperty('--wa-surface-border');
  }
}

// ---------- Info-Modal (zentral für alle Popups) ----------
function showInfoModal({ icon, text, number, buttons }) {
  const overlay = el('div', { class: 'info-modal-overlay' });
  const body = el('div', { class: 'body' });
  if (icon) body.appendChild(el('span', { class: 'icon-line' }, icon));
  if (text) body.appendChild(document.createTextNode(text + ' '));
  if (number) body.appendChild(el('span', { class: 'num-line' }, number));
  if (text && number) body.appendChild(document.createTextNode(' '));
  if (text && !number) {} // text already added
  // falls both text mit Lücke davor und nach — sauberer Fallback
  const actions = el('div', { class: 'actions' });
  for (const b of (buttons || [{ label: 'OK' }])) {
    actions.appendChild(el('button', {
      onclick: () => { overlay.remove(); b.onClick?.(); }
    }, b.label));
  }
  const modal = el('div', { class: 'info-modal' }, [body, actions]);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); } };
  document.body.appendChild(overlay);
  return overlay;
}

function showBanModal(number, opts = {}) {
  const overlay = el('div', { class: 'info-modal-overlay' });
  const body = el('div', { class: 'body' }, [
    'Your phone number ',
    el('span', { class: 'num-line' }, number),
    ' is banned from using WhatsApp. Please contact customer support for assistance.'
  ]);
  const actions = el('div', { class: 'actions' }, [
    el('button', { onclick: () => { overlay.remove(); opts.onCancel?.(); } }, 'Cancel'),
    el('button', { onclick: () => { overlay.remove(); opts.onSupport?.(); } }, 'Support')
  ]);
  const modal = el('div', { class: 'info-modal' }, [body, actions]);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); opts.onCancel?.(); } };
  document.body.appendChild(overlay);
}

function showLockedModal(number, opts = {}) {

    'Your phone number ',

    ' has been locked by the operator. You can request a review or contact support.'

  overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); opts.onCancel?.(); } };

function showUnlockedModal(number, opts = {}) {
  const overlay = el('div', { class: 'info-modal-overlay' });
  const body = el('div', { class: 'body' }, [
    el('span', { class: 'icon-line' }, '✓'),

function showConfirm(title, message, onOk, opts = {}) {
  const overlay = el('div', { class: 'info-modal-overlay' });

    el('div', { style: 'font-weight:600;font-size:15px;margin-bottom:8px;color:#fff' }, title),
    message
  ]);
  const actions = el('div', { class: 'actions' }, [
    el('button', { onclick: () => { overlay.remove(); } }, 'Cancel'),

  ]);
  const modal = el('div', { class: 'info-modal' }, [body, actions]);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

function showReportModal(target) {
  const overlay = el('div', { class: 'modal' });
  const reasonInput = el('textarea', { id: 'reportReason', placeholder: 'Grund (optional)', maxlength: 500 });
  const box = el('div', { class: 'box' }, [

    el('p', {}, 'Nummer: ' + target),
    reasonInput,
    el('div', { class: 'row' }, [

function showLightbox(src) {

    el('img', { src })
  ]);
  document.body.appendChild(overlay);
}

// ---------- Banned ----------
function handleLocked() {
  const wasNumber = me || localStorage.getItem('oldwhats_lastnumber') || '';
  lastLockedNum = wasNumber;
  if (socket) { socket.disconnect(); socket = null; }
  localStorage.removeItem('oldwhats_token');
  token = null;
  chatMessages = {}; peerProfiles = {}; currentPeer = null;
  renderBannedScreen(wasNumber);
}

async function renderBannedScreen(number) {
  if (bannedPollTimer) { clearInterval(bannedPollTimer); bannedPollTimer = null; }
  const app = document.getElementById('app');
  app.innerHTML = '';

  const statusHolder = el('div', { id: 'bannedStatus' });
  const actionsHolder = el('div', { class: 'actions', id: 'bannedActions' });

  const screen = el('div', { class: 'banned-screen' }, [
    el('div', { class: 'icon' }, '🚫'),
    el('h1', {}, 'Du bist banned'),
    el('div', { class: 'num' }, number || '—'),
    el('div', { class: 'msg' }, 'Diese Nummer wurde gesperrt und kann nicht mehr verwendet werden. Du kannst eine Prüfung anfordern — der Betreiber entscheidet dann, ob die Sperre aufgehoben wird.'),
    statusHolder,
    actionsHolder
  ]);
  app.appendChild(screen);

  await refreshBannedView(number, statusHolder, actionsHolder);
}

async function refreshBannedView(number, statusHolder, actionsHolder) {
  if (!number) {
    statusHolder.innerHTML = '';
    actionsHolder.innerHTML = '';
    actionsHolder.appendChild(el('button', { class: 'secondary', onclick: () => renderAuth('login') }, 'Zum Login'));
    return;
  }

  let appeal = { status: null };
  try {
    const r = await fetch('/api/appeal/' + encodeURIComponent(number));
    appeal = await r.json();
  } catch {}

  // Änderung prüfen
  if (appeal.status === 'approved' && lastLockedNum === number) {
    // Popup "freigegeben" einmalig
    if (!localStorage.getItem('oldwhats_unlockShown_' + number)) {
      localStorage.setItem('oldwhats_unlockShown_' + number, '1');
      if (bannedPollTimer) { clearInterval(bannedPollTimer); bannedPollTimer = null; }
      showUnlockedModal(number, { onOk: () => renderAuth('login') });
      return;
    }
  }

  statusHolder.innerHTML = '';
  actionsHolder.innerHTML = '';

  if (appeal.status === 'pending') {
    statusHolder.appendChild(el('div', { class: 'status-badge pending' }, '⏳ Prüfung läuft'));
    actionsHolder.appendChild(el('button', { class: 'secondary', onclick: () => refreshBannedView(number, statusHolder, actionsHolder) }, 'Status aktualisieren'));
    actionsHolder.appendChild(el('button', { class: 'secondary', onclick: () => { if (bannedPollTimer) clearInterval(bannedPollTimer); renderAuth('login'); } }, 'Zum Login'));
    if (bannedPollTimer) clearInterval(bannedPollTimer);
    bannedPollTimer = setInterval(() => refreshBannedView(number, statusHolder, actionsHolder), 8000);
  } else if (appeal.status === 'approved') {
    if (bannedPollTimer) { clearInterval(bannedPollTimer); bannedPollTimer = null; }
    statusHolder.appendChild(el('div', { class: 'status-badge approved' }, '✓ Freigegeben'));
    actionsHolder.appendChild(el('button', { class: 'success', onclick: () => renderAuth('login') }, 'Zum Login'));
  } else if (appeal.status === 'denied') {
    if (bannedPollTimer) { clearInterval(bannedPollTimer); bannedPollTimer = null; }
    statusHolder.appendChild(el('div', { class: 'status-badge denied' }, '✕ Prüfung abgelehnt'));
    actionsHolder.appendChild(el('button', { class: 'secondary', onclick: () => renderAuth('login') }, 'Zum Login'));
  } else {
    actionsHolder.appendChild(el('button', { class: 'primary', onclick: async () => {
      try {
        const r = await fetch('/api/appeal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ number }) });
        const data = await r.json();
        if (data.status === 'pending' || data.ok) {
          toast('Prüfung angefordert');
          refreshBannedView(number, statusHolder, actionsHolder);
        } else {
          toast('Fehler: ' + (data.error || 'unbekannt'));
        }
      } catch (e) { toast('Fehler: ' + e.message); }
    }}, 'Prüfung anfordern'));
    actionsHolder.appendChild(el('button', { class: 'secondary', onclick: () => renderAuth('login') }, 'Zum Login'));
  }
}

// ---------- Auth ----------
function renderAuth(mode = 'register') {
  if (bannedPollTimer) { clearInterval(bannedPollTimer); bannedPollTimer = null; }
  const app = document.getElementById('app');
  app.innerHTML = '';

  if (mode === 'owner') { renderOwnerLogin(); return; }

  const tabs = el('div', { class: 'tabs' }, [
    el('button', { class: mode === 'login' ? '' : 'active', onclick: () => renderAuth('login') }, 'Anmelden'),
    el('button', { class: mode === 'register' ? 'active' : '', onclick: () => renderAuth('register') }, 'Registrieren')
  ]);

  const wrap = el('div', { class: 'auth' }, [
    el('div', { class: 'logo' }, '💬'),
    el('h1', {}, 'WhatsApp'),
    el('p', { class: 'sub' }, mode === 'register'
      ? 'Ziehe dir eine Nummer, setze ein Passwort, fertig.'
      : 'Melde dich mit deiner Nummer und deinem Passwort an.'),
    tabs
  ]);

  if (mode === 'register') {
    const numDisplay = el('div', { class: 'num', id: 'numDisplay' }, '…');
    const tierBadge = el('div', { id: 'tierBadge' });
    const rerollBtn = el('button', { class: 'btn secondary', onclick: onRerollClick }, 'Neu ziehen');
    const pwInput = el('input', { type: 'password', id: 'pwInput', placeholder: 'Passwort (min. 4 Zeichen)', autocomplete: 'new-password' });
    const pw2Input = el('input', { type: 'password', id: 'pw2Input', placeholder: 'Passwort wiederholen', autocomplete: 'new-password' });
    const regBtn = el('button', { class: 'btn full', id: 'regBtn', onclick: doRegister }, 'Registrieren');
    const hint = el('div', { class: 'hint' }, 'Merke dir Nummer und Passwort — damit loggst du dich später und auf anderen Geräten ein.');

    wrap.appendChild(el('div', { class: 'label' }, 'Deine neue Nummer'));
    wrap.appendChild(numDisplay);
    wrap.appendChild(tierBadge);
    wrap.appendChild(el('div', { class: 'btn-row' }, [rerollBtn]));
    wrap.appendChild(el('div', { class: 'label', style: 'margin-top:14px' }, 'Passwort'));
    wrap.appendChild(pwInput);
    wrap.appendChild(pw2Input);
    wrap.appendChild(el('div', { class: 'btn-row' }, [regBtn]));
    wrap.appendChild(hint);
    wrap.appendChild(el('div', { class: 'owner-link', onclick: () => renderAuth('owner') }, 'Owner Login'));

    app.appendChild(wrap);
    loadGeneratedNumber();
  } else {
    const numInput = el('input', { type: 'tel', id: 'numInput', placeholder: '+7771234567', autocomplete: 'username' });
    const pwInput = el('input', { type: 'password', id: 'pwInput', placeholder: 'Passwort', autocomplete: 'current-password' });
    const loginBtn = el('button', { class: 'btn full', id: 'loginBtn', onclick: doLogin }, 'Anmelden');

    wrap.appendChild(el('div', { class: 'label' }, 'Deine Nummer'));
    wrap.appendChild(numInput);
    wrap.appendChild(el('div', { class: 'label', style: 'margin-top:14px' }, 'Passwort'));
    wrap.appendChild(pwInput);
    wrap.appendChild(el('div', { class: 'btn-row' }, [loginBtn]));
    wrap.appendChild(el('div', { class: 'owner-link', onclick: () => renderAuth('owner') }, 'Owner Login'));

    app.appendChild(wrap);
    setTimeout(() => numInput.focus(), 50);
    pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  }
}

let currentTier = null;

async function loadGeneratedNumber() {
  const display = document.getElementById('numDisplay');
  const badge = document.getElementById('tierBadge');
  if (!display) return;
  display.textContent = '…';
  if (badge) badge.innerHTML = '';
  try {
    const r = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    const data = await r.json();
    display.textContent = data.number;
    display.dataset.number = data.number;
    currentTier = data.tier;

    if (badge) {
      if (data.tier === 'clean') badge.innerHTML = '<span class="tier-badge tier-clean">✨ CLEAN</span>';
      else if (data.tier === 'half') badge.innerHTML = '<span class="tier-badge tier-half">✦ HALF CLEAN</span>';
    }

    const banRes = await fetch('/api/check/' + encodeURIComponent(data.number));
    const ban = await banRes.json();

    if (ban.banned) {
      showBanModal(data.number, {
        onCancel: () => loadGeneratedNumber(),
        onSupport: () => toast('Support: support@whatsapp.com')
      });
    } else if (ban.locked) {
      showLockedModal(data.number, {
        onCancel: () => loadGeneratedNumber(),
        onSupport: () => toast('Support: support@whatsapp.com')
      });
    }
  } catch (e) {
    display.textContent = 'Fehler';
  }
}

function onRerollClick() {
  if (currentTier === 'clean' || currentTier === 'half') {
    const label = currentTier === 'clean' ? 'CLEAN' : 'HALF CLEAN';
    showConfirm('Nummer behalten?', `Deine aktuelle Nummer ist eine ${label}-Nummer. Willst du sie wirklich wegwerfen?`, () => {
      loadGeneratedNumber();
    }, { okText: 'Neu ziehen' });
  } else {
    loadGeneratedNumber();
  }
}

async function doRegister() {
  const display = document.getElementById('numDisplay');
  const pw = document.getElementById('pwInput').value;
  const pw2 = document.getElementById('pw2Input').value;
  const number = display.dataset.number;
  if (!number) { toast('Nummer fehlt'); return; }
  if (pw.length < 4) { toast('Passwort zu kurz (min. 4)'); return; }
  if (pw !== pw2) { toast('Passwörter stimmen nicht überein'); return; }

  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'Erstelle…';
  try {
    const data = await api('/api/register', { method: 'POST', body: JSON.stringify({ number, password: pw }) });
    token = data.token; me = data.number;
    localStorage.setItem('oldwhats_token', token);
    localStorage.setItem('oldwhats_lastnumber', me);
    await bootstrapAfterLogin();
  } catch (e) {
    if (e.status === 403 && e.data?.error === 'locked') {
      localStorage.setItem('oldwhats_lastnumber', number);
      showLockedModal(number, {
        onCancel: () => renderBannedScreen(number),
        onSupport: () => toast('Support: support@whatsapp.com')
      });
    } else if (e.data?.error === 'number_taken') {
      toast('Nummer schon vergeben — neu ziehen'); loadGeneratedNumber();
    } else {
      toast('Fehler: ' + (e.data?.error || e.message));
    }
    btn.disabled = false; btn.textContent = 'Registrieren';
  }
}

async function doLogin() {
  const number = document.getElementById('numInput').value.trim();
  const pw = document.getElementById('pwInput').value;
  if (!number || !pw) { toast('Nummer und Passwort eingeben'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Melde an…';
  try {
    const data = await api('/api/login', { method: 'POST', body: JSON.stringify({ number, password: pw }) });
    token = data.token; me = data.number;
    localStorage.setItem('oldwhats_token', token);
    localStorage.setItem('oldwhats_lastnumber', me);
    await bootstrapAfterLogin();
  } catch (e) {
    if (e.status === 403 && e.data?.error === 'locked') {
      localStorage.setItem('oldwhats_lastnumber', number);
      showLockedModal(number, {
        onCancel: () => renderBannedScreen(number),
        onSupport: () => toast('Support: support@whatsapp.com')
      });
    } else {
      toast('Nummer oder Passwort falsch');
    }
    btn.disabled = false; btn.textContent = 'Anmelden';
  }
}

// ---------- Owner ----------
function renderOwnerLogin() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const userInput = el('input', { type: 'text', id: 'ownerUser', placeholder: 'Benutzername' });
  const pwInput = el('input', { type: 'password', id: 'ownerPw', placeholder: 'Passwort' });
  const loginBtn = el('button', { class: 'btn full', id: 'ownerBtn', onclick: doOwnerLogin }, 'Owner anmelden');

  const wrap = el('div', { class: 'auth' }, [
    el('div', { class: 'logo', style: 'background:#c62828' }, '🔒'),
    el('h1', { style: 'color:#c62828' }, 'Owner'),
    el('p', { class: 'sub' }, 'Nur für den Betreiber.'),
    el('div', { class: 'label' }, 'Benutzername'),
    userInput,
    el('div', { class: 'label', style: 'margin-top:14px' }, 'Passwort'),
    pwInput,
    el('div', { class: 'btn-row' }, [loginBtn]),
    el('div', { class: 'owner-link', onclick: () => renderAuth('login') }, 'Zurück zum Login')
  ]);
  app.appendChild(wrap);
  setTimeout(() => userInput.focus(), 50);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doOwnerLogin(); });
}

async function doOwnerLogin() {
  const username = document.getElementById('ownerUser').value.trim();
  const password = document.getElementById('ownerPw').value;
  if (!username || !password) { toast('Felder ausfüllen'); return; }
  const btn = document.getElementById('ownerBtn');
  btn.disabled = true; btn.textContent = 'Melde an…';
  try {
    const data = await ownerApi('/api/owner/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    ownerToken = data.token;
    localStorage.setItem('oldwhats_ownertoken', ownerToken);

  } catch (e) {
    toast('Zugangsdaten falsch');
    btn.disabled = false; btn.textContent = 'Owner anmelden';

async function renderOwnerPanel(tab = 'reports') {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const panel = el('div', { class: 'owner-panel' });
  panel.appendChild(el('div', { class: 'topbar' }, [
    el('div', { class: 'title' }, 'Owner'),

      ownerApi('/api/owner/logout', { method: 'POST' }).catch(() => {});

      ownerToken = null;
      renderAuth('owner');
    }}, 'Logout')
  ]));
  panel.appendChild(el('div', { class: 'tabs' }, [
    el('button', { class: tab === 'reports' ? 'active' : '', onclick: () => renderOwnerPanel('reports') }, 'Reports'),
    el('button', { class: tab === 'appeals' ? 'active' : '', onclick: () => renderOwnerPanel('appeals') }, 'Prüfungen')
  ]));
  const list = el('div', { class: 'list', id: 'ownerList' }, [el('div', { class: 'empty' }, 'Lade…')]);
  panel.appendChild(list);
  app.appendChild(panel);

  if (tab === 'reports') await loadReports(list);
  else await loadAppeals(list);
}

async function loadReports(list) {
  try {
    const reports = await ownerApi('/api/owner/reports');
    list.innerHTML = '';
    if (reports.length === 0) { list.appendChild(el('div', { class: 'empty' }, 'Keine Reports.')); return; }
    for (const r of reports) {
      const card = el('div', { class: 'report-card' }, [
        el('div', { class: 'meta-row' }, [el('span', {}, 'von ' + r.reporter), el('span', {}, fmtDate(r.ts))]),
        el('div', { class: 'target' }, r.target),
        r.reason ? el('div', { class: 'reason' }, r.reason) : null,
        r.status === 'pending'
          ? el('div', { class: 'actions' }, [
              el('button', { class: 'lock', onclick: () => decideReport(r.id, 'lock') }, 'Sperren'),
              el('button', { class: 'unlock', onclick: () => decideReport(r.id, 'unlock') }, 'Freigeben'),
              el('button', { class: 'dismiss', onclick: () => decideReport(r.id, 'dismiss') }, 'Verwerfen')
            ])
          : el('div', { class: 'status ' + r.status }, r.status)
      ]);
      list.appendChild(card);
    }
  } catch (e) {
    list.innerHTML = '';
    list.appendChild(el('div', { class: 'empty' }, 'Fehler: ' + e.message));
  }

  async function decideReport(id, decision) {
    try {
      await ownerApi('/api/owner/decide', { method: 'POST', body: JSON.stringify({ reportId: id, decision }) });
      toast(decision === 'lock' ? 'Gesperrt — User wurde gekickt' : 'Entschieden: ' + decision);
      renderOwnerPanel('reports');
    } catch (e) { toast('Fehler: ' + e.message); }
  }
}

async function loadAppeals(list) {

    list.innerHTML = '';

// ---------- Bootstrap ----------
async function bootstrapAfterLogin() {
  try {
    profile = await api('/api/me');
    me = profile.number;
    localStorage.setItem('oldwhats_lastnumber', me);
    applyTheme(profile.theme);
    if (!profile.name) {
      const name = prompt('Wie soll dein Name sein?', 'Anon') || 'Anon';
      await api('/api/profile', { method: 'POST', body: JSON.stringify({ name }) });
      profile.name = name;
    }
    await loadContacts();
    connectSocket();
    await loadChats();
    renderChatList();
  } catch (e) {
    if (e.status === 401) { logout(); return; }
    toast('Fehler beim Laden: ' + e.message);
  }
}

function connectSocket() {
  if (socket) socket.disconnect();
  socket = io({ auth: { token } });
  socket.on('message', (msg) => {
    const key = [msg.from, msg.to].sort().join('|');
    chatMessages[key] = chatMessages[key] || [];
    if (!chatMessages[key].some(m => m.ts === msg.ts && m.from === msg.from)) {
      chatMessages[key].push(msg);
    }
    if (currentPeer && (msg.from === currentPeer || msg.to === currentPeer)) renderChat();
    else loadChats().then(renderChatList);
  });
  socket.on('kicked', () => handleLocked());
  socket.on('connect_error', () => toast('Socket-Verbindung fehlgeschlagen'));
}

async function loadContacts() {
  try { contacts = await api('/api/contacts'); } catch { contacts = {}; }
}

async function loadChats() {
  try {
    const list = await api('/api/chats');
    await Promise.all(list.map(c => loadMessages(c.peer)));
    await Promise.all(list.map(c => loadPeerProfile(c.peer)));
  } catch {}
}
async function loadMessages(peer) {
  const key = [me, peer].sort().join('|');
  try { chatMessages[key] = await api('/api/messages/' + encodeURIComponent(peer)); } catch {}
}
async function loadPeerProfile(peer) {
  if (peerProfiles[peer]) return;
  try { peerProfiles[peer] = await api('/api/user/' + encodeURIComponent(peer)); } catch {}
}

// ---------- Chat-Liste ----------
async function renderChatList() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el('header', {}, [
    avatarFor(profile?.name || me, 36, profile?.picture),
    el('div', { class: 'title' }, 'WhatsApp'),
    el('div', { class: 'actions' }, [
      el('button', { onclick: renderSettings, title: 'Einstellungen' }, '⋮')
    ])
  ]));

  const wrap = el('div', { class: 'chatlist-wrap' });
  const list = el('div', { class: 'chatlist' });

  const allPeers = new Set();
  for (const key of Object.keys(chatMessages)) {
    const [a, b] = key.split('|');
    if (a !== me) allPeers.add(a);
    if (b !== me) allPeers.add(b);
  }
  if (allPeers.size === 0) {
    list.appendChild(el('div', { class: 'empty' }, [
      el('div', { class: 'icon' }, '💬'),
      el('div', {}, 'Noch keine Chats.'),
      el('div', {}, 'Tippe auf + unten links um einen Kontakt anzuschreiben.')
    ]));
  } else {
    const arr = [...allPeers].map(p => {
      const key = [me, p].sort().join('|');
      const msgs = chatMessages[key] || [];
      return { peer: p, last: msgs[msgs.length - 1] };
    }).sort((a, b) => (b.last?.ts || 0) - (a.last?.ts || 0));
    for (const { peer, last } of arr) {
      const pp = peerProfiles[peer] || {};
      const displayName = contacts[peer] || pp.name || peer;
      let preview = 'Tippe um zu chatten';
      if (last) preview = last.type === 'image' ? '📷 Foto' : last.text;
      list.appendChild(el('div', { class: 'chatitem', onclick: () => openChat(peer) }, [
        avatarFor(displayName, 48, pp.picture),
        el('div', { class: 'info' }, [
          el('div', { class: 'name' }, displayName),
          el('div', { class: 'preview' }, preview)
        ]),
        el('div', { class: 'meta' }, last ? fmtTime(last.ts) : '')
      ]));
    }
  }
  wrap.appendChild(list);
  wrap.appendChild(el('button', { class: 'fab', title: 'Neuer Chat', onclick: openContactsSheet }, '+'));
  app.appendChild(wrap);
}

function openContactsSheet() {
  const contactNumbers = Object.keys(contacts);
  const overlay = el('div', { class: 'modal', onclick: (e) => { if (e.target.classList.contains('modal')) overlay.remove(); } });
  const box = el('div', { class: 'box' });
  box.appendChild(el('h2', {}, 'Neuer Chat'));

  if (contactNumbers.length > 0) {
    box.appendChild(el('p', {}, 'Kontakt auswählen:'));
    const list = el('div', { class: 'contact-list' });
    const sorted = [...contactNumbers].sort((a, b) => (contacts[a] || '').localeCompare(contacts[b] || ''));
    for (const num of sorted) {
      list.appendChild(el('div', {
        class: 'contact-item',
        onclick: () => { overlay.remove(); openChat(num); }
      }, [
        el('div', {}, [
          el('div', { class: 'cname' }, contacts[num]),
          el('div', { class: 'cnum' }, num)
        ]),
        el('span', { style: 'color:var(--wa-green);font-size:20px' }, '›')
      ]));
    }
    box.appendChild(list);
  } else {
    box.appendChild(el('p', {}, 'Noch keine Kontakte. Füge welche in den Einstellungen hinzu — oder gib direkt eine Nummer ein.'));
  }

  box.appendChild(el('div', { style: 'border-top:1px solid #eee;padding-top:12px;margin-top:4px' }, [
    el('div', { style: 'font-size:12px;color:var(--wa-meta);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px' }, 'Neue Nummer'),
    el('input', { id: 'peerInput', placeholder: '+7771234567', inputmode: 'tel',
      onkeydown: (e) => { if (e.key === 'Enter') submit(); } })
  ]));

  box.appendChild(el('div', { class: 'row' }, [
    el('button', { class: 'cancel', onclick: () => overlay.remove() }, 'Schließen'),
    el('button', { class: 'ok', onclick: submit }, 'Öffnen')
  ]));
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('peerInput')?.focus(), 50);

  function submit() {
    const v = document.getElementById('peerInput').value.trim();
    if (!v) return;
    if (v === me) { toast('Das ist deine eigene Nummer'); return; }
    overlay.remove();
    openChat(v);
  }
}

// ---------- Chat ----------
async function openChat(peer) {
  currentPeer = peer;
  await loadMessages(peer);
  await loadPeerProfile(peer);
  renderChat();
}

function renderChat() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const pp = peerProfiles[currentPeer] || {};
  const displayName = contacts[currentPeer] || pp.name || currentPeer;

  app.appendChild(el('header', {}, [
    el('button', { class: 'back', onclick: backToList }, '←'),
    avatarFor(displayName, 36, pp.picture),
    el('div', { class: 'title' }, [
      el('div', {}, displayName),
      el('div', { class: 'sub' }, currentPeer)
    ]),
    el('div', { class: 'actions' }, [
      el('button', { onclick: () => showReportModal(currentPeer), title: 'Nummer melden' }, '🚩'),
      el('button', { onclick: () => toast('Nummer: ' + currentPeer) }, '⋮')
    ])
  ]));

  const view = el('div', { class: 'chatview' });
  const messages = el('div', { class: 'messages', id: 'messages' });
  view.appendChild(messages);

  // Bild-Picker (hidden)
  const fileInput = el('input', { type: 'file', accept: 'image/*', id: 'imgPicker', style: 'display:none',
    onchange: onImagePicked });

  const composer = el('div', { class: 'composer' }, [
    el('button', { class: 'attach', title: 'Bild senden', onclick: () => document.getElementById('imgPicker').click() }, '📎'),
    el('input', { type: 'text', id: 'composerInput', placeholder: 'Nachricht', autocomplete: 'off',
      onkeydown: (e) => { if (e.key === 'Enter') sendMessage(); } }),
    el('button', { class: 'send', onclick: sendMessage }, '➤'),
    fileInput
  ]);
  view.appendChild(composer);
  app.appendChild(view);

  const key = [me, currentPeer].sort().join('|');
  const msgs = chatMessages[key] || [];
  for (const m of msgs) {
    messages.appendChild(buildMessageEl(m));
  }
  messages.scrollTop = messages.scrollHeight;
  setTimeout(() => document.getElementById('composerInput')?.focus(), 50);
}

function buildMessageEl(m) {
  const out = m.from === me;
  const wrap = el('div', { class: 'msg ' + (out ? 'out' : 'in') + (m.type === 'image' ? ' image' : '') });
  if (m.type === 'image') {
    const img = el('img', { src: m.data, alt: '', onclick: () => showLightbox(m.data) });
    wrap.appendChild(img);
  } else {
    wrap.appendChild(el('div', {}, m.text));
  }
  wrap.appendChild(el('div', { class: 'time' }, [
    fmtTime(m.ts),
    out ? el('span', { class: 'tick' }, '✓✓') : null
  ]));
  return wrap;
}

function sendMessage() {
  const input = document.getElementById('composerInput');
  const text = input.value.trim();
  if (!text || !currentPeer) return;
  socket.emit('message', { to: currentPeer, text });
  input.value = '';
  input.focus();
}

function onImagePicked(e) {
  const file = e.target.files[0];
  if (!file || !currentPeer) return;
  if (!file.type.startsWith('image/')) { toast('Nur Bilder'); return; }

  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      // Downscale auf max 1280px Breite/Höhe, jpeg q 0.82
      const max = 1280;
      const ratio = Math.min(max / img.width, max / img.height, 1);
      const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = c.toDataURL('image/jpeg', 0.82);
      socket.emit('message', { to: currentPeer, type: 'image', data: dataUrl });
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function backToList() { currentPeer = null; loadChats().then(renderChatList); }

function onPicChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = ev => {
    img.onload = () => {
      const max = 240;
      const ratio = Math.min(max / img.width, max / img.height, 1);
      const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      profile.picture = c.toDataURL('image/jpeg', 0.82);
      renderSettings();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

let checkState = { country: COUNTRIES[1], number: '', result: null };

function parseNumber(num) {
  const sorted = [...COUNTRIES].sort((a, b) => b.code.length - a.code.length);
  for (const c of sorted) if (num.startsWith(c.code)) return { country: c, rest: num.slice(c.code.length) };
  const m = String(num).match(/^(\+\d{1,4})(.*)$/);
  if (m) return { country: { name: m[1], code: m[1] }, rest: m[2] };
  return { country: { name: '—', code: '' }, rest: String(num) };
}

function renderNumberCheck() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const myParsed = parseNumber(me);

  const screen = el('div', { class: 'check-screen' }, [
    el('div', { class: 'topbar' }, [
      el('button', { class: 'cancel', onclick: () => { checkState.result = null; renderSettings(); } }, 'Cancel'),
      el('div', { class: 'title' }, 'Nummern-Check'),
      el('button', { class: 'action', id: 'checkAction', onclick: runNumberCheck }, 'Prüfen')
    ]),
    el('div', { class: 'body' }, [
      el('div', { class: 'section-label' }, 'Deine Nummer:'),
      el('div', { class: 'country-row readonly' }, [
        el('span', {}, myParsed.country.name),
        el('span', { class: 'chev' }, '›')
      ]),
      el('div', { class: 'number-row' }, [
        el('span', { class: 'prefix' }, myParsed.country.code),
        el('span', { class: 'display' }, myParsed.rest || me)
      ]),

      el('div', { class: 'section-label' }, 'Zu prüfende Nummer:'),
      el('div', { class: 'country-row', onclick: openCountryPicker }, [
        el('span', { id: 'countryName' }, checkState.country.name),
        el('span', { class: 'chev' }, '›')
      ]),
      el('div', { class: 'number-row' }, [
        el('span', { class: 'prefix' }, checkState.country.code),
        el('input', { id: 'checkNumberInput', placeholder: '707-102555', value: checkState.number, inputmode: 'tel',
          oninput: (e) => { checkState.number = e.target.value; } })
      ])
    ])
  ]);
  app.appendChild(screen);

  setTimeout(() => {
    const inp = document.getElementById('checkNumberInput');
    inp?.focus();
    inp?.addEventListener('keydown', e => { if (e.key === 'Enter') runNumberCheck(); });
  }, 50);
}

function openCountryPicker() {
  const overlay = el('div', { class: 'country-picker' });
  const sheet = el('div', { class: 'sheet' }, [
    el('h3', {}, 'Land auswählen'),
    el('div', { class: 'list' }, COUNTRIES.map(c =>
      el('div', { class: 'item', onclick: () => { checkState.country = c; overlay.remove(); renderNumberCheck(); } }, [
        el('span', {}, c.name),
        el('span', { class: 'code' }, c.code)
      ])
    ))
  ]);
  overlay.appendChild(sheet);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

async function runNumberCheck() {
  const digits = (checkState.number || '').replace(/\D/g, '');
  if (digits.length < 4) { toast('Nummer eingeben'); return; }
  const fullNumber = checkState.country.code + digits;
  const btn = document.getElementById('checkAction');
  btn.disabled = true; btn.textContent = '…';
  try {
    const res = await fetch('/api/check/' + encodeURIComponent(fullNumber));
    const data = await res.json();

    if (data.banned) {
      showBanModal(fullNumber, {
        onCancel: () => {},
        onSupport: () => toast('Support: support@whatsapp.com')
      });
    } else if (data.locked) {
      showLockedModal(fullNumber, {
        onCancel: () => {},
        onSupport: () => toast('Support: support@whatsapp.com')
      });
    } else {
      // freie Nummer → nichts inline, nur stille Info
      showInfoModal({
        icon: '✓',
        text: 'Number is not banned:',
        number: fullNumber,
        buttons: [{ label: 'OK' }]
      });
    }
  } catch (e) { toast('Fehler: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Prüfen'; }
}

function logout() {
  api('/api/logout', { method: 'POST' }).catch(() => {});
  if (socket) { socket.disconnect(); socket = null; }
  localStorage.removeItem('oldwhats_token');
  token = null; me = null; profile = null;
  chatMessages = {}; peerProfiles = {}; contacts = {}; currentPeer = null;
  checkState = { country: COUNTRIES[1], number: '', result: null };
  applyTheme(null);
  renderAuth('login');
}

// ---------- Boot ----------
(async function boot() {
  if (ownerToken) { renderOwnerPanel('reports'); return; }
  if (!token) { renderAuth('register'); return; }
  try {
    profile = await api('/api/me');
    me = profile.number;
    localStorage.setItem('oldwhats_lastnumber', me);
    applyTheme(profile.theme);
    await loadContacts();
    connectSocket();
    await loadChats();
    renderChatList();
  } catch (e) {
    if (e.status === 401 || (e.status === 403 && e.data?.error === 'locked')) {
      localStorage.removeItem('oldwhats_token');
      token = null;
      if (e.status === 403) {
        renderBannedScreen(localStorage.getItem('oldwhats_lastnumber') || '');
      } else {
        renderAuth('login');
      }
    }
    else { toast('Fehler: ' + e.message); renderAuth('login'); }
  }
})();
