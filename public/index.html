<!-- language: HTML/CSS/JS, file: public/index.html, target: mobile + desktop -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhatsApp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; background: #000; }
  :root {
    --wa-green: #075e54;
    --wa-green-dark: #054d44;
    --wa-green-light: #128c7e;
    --wa-bubble-out: #dcf8c6;
    --wa-bubble-in: #ffffff;
    --wa-bg: #ece5dd;
    --wa-text: #111;
    --wa-meta: #667781;
    --wa-divider: #d9d9d9;
  }
  body { display: flex; justify-content: center; background: #111; }
  .app {
    width: 100%; max-width: 480px; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--wa-bg); position: relative; overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,.6);
  }
  @media (min-width: 768px) { .app { max-width: 900px; } }

  header {
    background: var(--wa-green); color: #fff;
    padding: 10px 12px; display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 500; flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.2); z-index: 10;
  }
  header .back { background: transparent; border: 0; color: #fff; font-size: 22px; cursor: pointer; padding: 0 6px 0 0; line-height: 1; }
  header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--wa-green-light); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0; overflow: hidden;
  }
  header .avatar img { width: 100%; height: 100%; object-fit: cover; }
  header .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .title .sub { font-size: 11px; opacity: .85; font-weight: 400; }
  header .actions { display: flex; gap: 4px; }
  header .actions button { background: transparent; border: 0; color: #fff; font-size: 20px; cursor: pointer; padding: 4px 8px; line-height: 1; }

  /* Auth */
  .auth {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    align-items: center; padding: 24px; text-align: center; background: #fff;
    overflow-y: auto;
  }
  .auth .logo { width: 72px; height: 72px; border-radius: 50%; background: var(--wa-green); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 16px; }
  .auth h1 { color: var(--wa-green); font-size: 24px; margin-bottom: 6px; }
  .auth .sub { color: var(--wa-meta); font-size: 13px; margin-bottom: 24px; line-height: 1.4; }
  .auth .tabs { display: flex; gap: 0; margin-bottom: 20px; border: 1px solid var(--wa-green); border-radius: 4px; overflow: hidden; }
  .auth .tabs button {
    background: #fff; color: var(--wa-green); border: 0; padding: 10px 22px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .auth .tabs button.active { background: var(--wa-green); color: #fff; }
  .auth .label { color: var(--wa-meta); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; align-self: flex-start; }
  .auth .num {
    font-size: 22px; font-weight: 700; color: var(--wa-text);
    padding: 14px 22px; background: #f7f7f7; border: 1px solid var(--wa-divider);
    border-radius: 6px; margin-bottom: 10px; letter-spacing: 1px; font-family: 'Courier New', monospace;
    width: 100%; text-align: center;
  }
  .auth input[type=text], .auth input[type=password], .auth input[type=tel] {
    width: 100%; padding: 12px 14px; border: 1px solid var(--wa-divider);
    border-radius: 4px; font-size: 15px; outline: none; margin-bottom: 10px;
  }
  .auth input:focus { border-color: var(--wa-green); }
  .auth .full { width: 100%; }
  .btn {
    background: var(--wa-green); color: #fff; border: 0;
    padding: 12px 22px; border-radius: 4px; font-size: 15px;
    cursor: pointer; margin: 4px; font-weight: 500; letter-spacing: .3px;
  }
  .btn.secondary { background: var(--wa-green-light); }
  .btn:disabled { background: #999; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .hint { color: var(--wa-meta); font-size: 12px; margin-top: 10px; line-height: 1.5; }

  .chatlist { flex: 1; overflow-y: auto; background: #fff; }
  .chatlist .empty { padding: 60px 30px; text-align: center; color: var(--wa-meta); font-size: 14px; line-height: 1.6; }
  .chatlist .empty .icon { font-size: 48px; opacity: .3; margin-bottom: 12px; }
  .chatitem {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-bottom: 1px solid #e9edef; cursor: pointer; background: #fff;
  }
  .chatitem:active { background: #f0f0f0; }
  .chatitem .avatar {
    width: 48px; height: 48px; border-radius: 50%; background: var(--wa-green-light);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; flex-shrink: 0; overflow: hidden;
  }
  .chatitem .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chatitem .info { flex: 1; min-width: 0; }
  .chatitem .name { font-weight: 500; color: var(--wa-text); font-size: 15px; margin-bottom: 2px; }
  .chatitem .preview { color: var(--wa-meta); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatitem .meta { color: var(--wa-meta); font-size: 11px; text-align: right; flex-shrink: 0; }

  .chatview { flex: 1; display: flex; flex-direction: column; background: var(--wa-bg); overflow: hidden; }
  .messages {
    flex: 1; overflow-y: auto; padding: 10px 8px;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.4) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.4) 0%, transparent 40%),
      var(--wa-bg);
  }
  .msg {
    max-width: 78%; padding: 6px 9px 5px; margin-bottom: 4px;
    border-radius: 7px; font-size: 14.5px; line-height: 1.35;
    word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,.13);
    animation: pop .12s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: .6; } to { transform: scale(1); opacity: 1; } }
  .msg.out { background: var(--wa-bubble-out); margin-left: auto; border-top-right-radius: 0; }
  .msg.in  { background: var(--wa-bubble-in); margin-right: auto; border-top-left-radius: 0; }
  .msg .time { font-size: 10.5px; color: var(--wa-meta); text-align: right; margin-top: 2px; }
  .msg .tick { color: #4fc3f7; margin-left: 3px; }
  .composer { display: flex; gap: 6px; padding: 6px 8px; background: #f0f0f0; border-top: 1px solid #ddd; flex-shrink: 0; align-items: flex-end; }
  .composer input { flex: 1; padding: 10px 14px; border: 0; border-radius: 18px; font-size: 15px; outline: none; background: #fff; }
  .composer button { background: var(--wa-green); color: #fff; border: 0; border-radius: 50%; width: 40px; height: 40px; font-size: 17px; cursor: pointer; flex-shrink: 0; }

  .settings { flex: 1; overflow-y: auto; background: #fff; }
  .settings .section { padding: 20px 16px; border-bottom: 1px solid #eee; }
  .settings .section h3 { color: var(--wa-green); font-size: 13px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; font-weight: 600; }
  .settings .profile-row { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .settings .profile-pic {
    width: 72px; height: 72px; border-radius: 50%; background: var(--wa-green-light);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 26px; flex-shrink: 0; cursor: pointer;
    overflow: hidden; position: relative;
  }
  .settings .profile-pic img { width: 100%; height: 100%; object-fit: cover; }
  .settings .profile-pic .cam {
    position: absolute; bottom: 0; right: 0; background: var(--wa-green);
    width: 22px; height: 22px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 11px; border: 2px solid #fff;
  }
  .settings .field { margin-bottom: 14px; }
  .settings .field label { display: block; color: var(--wa-meta); font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
  .settings .field input, .settings .field .value {
    width: 100%; padding: 10px 12px; border: 1px solid var(--wa-divider);
    border-radius: 4px; font-size: 15px; outline: none; background: #fff; color: var(--wa-text);
  }
  .settings .field input:focus { border-color: var(--wa-green); }
  .settings .field .value { font-family: 'Courier New', monospace; font-weight: 700; background: #f7f7f7; color: var(--wa-green-dark); }
  .settings .check-row { display: flex; gap: 8px; }
  .settings .check-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--wa-divider); border-radius: 4px; font-size: 15px; outline: none; }
  .settings .check-result { margin-top: 12px; padding: 12px; border-radius: 4px; font-size: 14px; display: none; }
  .settings .check-result.show { display: block; }
  .settings .check-result.banned { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }
  .settings .check-result.ok { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32; }
  .settings .check-result.info { background: #f5f5f5; color: var(--wa-meta); border-left: 4px solid var(--wa-meta); }
  .settings .hint { color: var(--wa-meta); font-size: 12px; margin-top: 8px; line-height: 1.5; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal .box { background: #fff; border-radius: 6px; padding: 22px; max-width: 340px; width: 100%; }
  .modal .box h2 { color: var(--wa-green); margin-bottom: 10px; font-size: 17px; font-weight: 600; }
  .modal .box p { color: var(--wa-text); margin-bottom: 16px; line-height: 1.5; font-size: 14px; }
  .modal .box input { width: 100%; padding: 10px 12px; border: 1px solid var(--wa-divider); border-radius: 4px; font-size: 15px; margin-bottom: 16px; outline: none; }
  .modal .box .row { display: flex; gap: 8px; justify-content: flex-end; }
  .modal .box .row button { padding: 9px 16px; border: 0; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: 500; }
  .modal .box .row .cancel { background: #eee; color: #333; }
  .modal .box .row .ok { background: var(--wa-green); color: #fff; }

  /* Ban-Modal (WhatsApp Dark) */
  .ban-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; padding: 20px;
  }
  .ban-modal { background: #2a2a2a; border-radius: 14px; width: 100%; max-width: 340px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .ban-modal .content { padding: 30px 26px; color: #fff; text-align: center; font-size: 15.5px; line-height: 1.55; }
  .ban-modal .content strong { font-weight: 600; color: #fff; }
  .ban-modal .buttons { display: flex; border-top: 1px solid #3d3d3d; }
  .ban-modal .buttons button {
    flex: 1; background: transparent; border: 0; color: #25d366;
    padding: 17px 16px; font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .ban-modal .buttons button:first-child { border-right: 1px solid #3d3d3d; }
  .ban-modal .buttons button:active { background: rgba(255,255,255,.06); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px;
    border-radius: 20px; font-size: 13px; z-index: 400;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
// ---------- State ----------
let token = localStorage.getItem('oldwhats_token') || null;
let me = null;                // number
let profile = null;           // { number, name, picture, status }
let socket = null;
let currentPeer = null;
let chatMessages = {};        // key: "a|b" sorted
let peerProfiles = {};        // number -> { name, picture, status, exists }

function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, Object.assign({}, opts, { headers })).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.error || ('http_' + r.status)), { status: r.status, data });
    return data;
  });
}

// ---------- Helpers ----------
function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'onclick') e.onclick = v;
    else if (k === 'onkeydown') e.onkeydown = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('data-')) e.setAttribute(k, v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}
function fmtTime(ts) { const d = new Date(ts); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }
function initials(num) { return (num || '').replace(/[^\d]/g, '').slice(-2) || '??'; }
function toast(msg) { const t = el('div', { class: 'toast' }, msg); document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function avatarFor(label, size, pic) {
  const div = el('div', { class: 'avatar', style: `width:${size}px;height:${size}px;font-size:${Math.round(size*0.35)}px` });
  if (pic) div.appendChild(el('img', { src: pic, alt: '' }));
  else div.textContent = (label || '').replace(/[^\d]/g, '').slice(-2) || '??';
  return div;
}

function showBanModal(number, opts = {}) {
  const overlay = el('div', { class: 'ban-modal-overlay' });
  const modal = el('div', { class: 'ban-modal' }, [
    el('div', { class: 'content' }, [
      'Your phone number ',
      el('strong', {}, number),
      ' is banned from using WhatsApp. Please contact customer support for assistance.'
    ]),
    el('div', { class: 'buttons' }, [
      el('button', { onclick: () => { overlay.remove(); opts.onCancel?.(); } }, 'Cancel'),
      el('button', { onclick: () => { overlay.remove(); opts.onSupport?.(); } }, 'Support')
    ])
  ]);
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); opts.onCancel?.(); } };
  document.body.appendChild(overlay);
}

// ---------- Auth screen ----------
function renderAuth(mode = 'register') {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const tabs = el('div', { class: 'tabs' }, [
    el('button', { class: mode === 'login' ? '' : 'active', onclick: () => renderAuth('login') }, 'Anmelden'),
    el('button', { class: mode === 'register' ? 'active' : '', onclick: () => renderAuth('register') }, 'Registrieren')
  ]);

  const wrap = el('div', { class: 'auth' }, [
    el('div', { class: 'logo' }, '💬'),
    el('h1', {}, 'WhatsApp'),
    el('p', { class: 'sub' }, mode === 'register'
      ? 'Ziehe dir eine Nummer, setze ein Passwort, fertig.'
      : 'Melde dich mit deiner Nummer und deinem Passwort an.'),
    tabs
  ]);

  if (mode === 'register') {
    const numDisplay = el('div', { class: 'num', id: 'numDisplay' }, '…');
    const rerollBtn = el('button', { class: 'btn secondary', onclick: loadGeneratedNumber }, 'Neu ziehen');
    const pwInput = el('input', { type: 'password', id: 'pwInput', placeholder: 'Passwort (min. 4 Zeichen)', autocomplete: 'new-password' });
    const pw2Input = el('input', { type: 'password', id: 'pw2Input', placeholder: 'Passwort wiederholen', autocomplete: 'new-password' });
    const regBtn = el('button', { class: 'btn full', id: 'regBtn', onclick: doRegister }, 'Registrieren');
    const hint = el('div', { class: 'hint' }, 'Merke dir Nummer und Passwort — damit loggst du dich später und auf anderen Geräten ein.');

    wrap.appendChild(el('div', { class: 'label' }, 'Deine neue Nummer'));
    wrap.appendChild(numDisplay);
    wrap.appendChild(el('div', { class: 'btn-row' }, [rerollBtn]));
    wrap.appendChild(el('div', { class: 'label', style: 'margin-top:14px' }, 'Passwort'));
    wrap.appendChild(pwInput);
    wrap.appendChild(pw2Input);
    wrap.appendChild(el('div', { class: 'btn-row' }, [regBtn]));
    wrap.appendChild(hint);

    app.appendChild(wrap);
    loadGeneratedNumber();
  } else {
    const numInput = el('input', { type: 'tel', id: 'numInput', placeholder: '+7771234567', autocomplete: 'username' });
    const pwInput = el('input', { type: 'password', id: 'pwInput', placeholder: 'Passwort', autocomplete: 'current-password' });
    const loginBtn = el('button', { class: 'btn full', id: 'loginBtn', onclick: doLogin }, 'Anmelden');

    wrap.appendChild(el('div', { class: 'label' }, 'Deine Nummer'));
    wrap.appendChild(numInput);
    wrap.appendChild(el('div', { class: 'label', style: 'margin-top:14px' }, 'Passwort'));
    wrap.appendChild(pwInput);
    wrap.appendChild(el('div', { class: 'btn-row' }, [loginBtn]));

    app.appendChild(wrap);
    setTimeout(() => numInput.focus(), 50);
    pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  }
}

async function loadGeneratedNumber() {
  const display = document.getElementById('numDisplay');
  if (!display) return;
  display.textContent = '…';
  try {
    const r = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    const data = await r.json();
    display.textContent = data.number;
    display.dataset.number = data.number;

    // Ban-Check direkt
    const banRes = await fetch('/api/check/' + encodeURIComponent(data.number));
    const ban = await banRes.json();
    if (ban.banned) showBanModal(data.number);
  } catch (e) {
    display.textContent = 'Fehler';
  }
}

async function doRegister() {
  const display = document.getElementById('numDisplay');
  const pw = document.getElementById('pwInput').value;
  const pw2 = document.getElementById('pw2Input').value;
  const number = display.dataset.number;
  if (!number) { toast('Nummer fehlt'); return; }
  if (pw.length < 4) { toast('Passwort zu kurz (min. 4)'); return; }
  if (pw !== pw2) { toast('Passwörter stimmen nicht überein'); return; }

  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'Erstelle…';
  try {
    const data = await api('/api/register', { method: 'POST', body: JSON.stringify({ number, password: pw }) });
    token = data.token; me = data.number;
    localStorage.setItem('oldwhats_token', token);
    await bootstrapAfterLogin();
  } catch (e) {
    if (e.data?.error === 'number_taken') { toast('Nummer schon vergeben — neu ziehen'); loadGeneratedNumber(); }
    else if (e.data?.error === 'password_too_short') toast('Passwort zu kurz');
    else toast('Fehler: ' + (e.data?.error || e.message));
    btn.disabled = false; btn.textContent = 'Registrieren';
  }
}

async function doLogin() {
  const number = document.getElementById('numInput').value.trim();
  const pw = document.getElementById('pwInput').value;
  if (!number || !pw) { toast('Nummer und Passwort eingeben'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Melde an…';
  try {
    const data = await api('/api/login', { method: 'POST', body: JSON.stringify({ number, password: pw }) });
    token = data.token; me = data.number;
    localStorage.setItem('oldwhats_token', token);
    await bootstrapAfterLogin();
  } catch (e) {
    toast('Nummer oder Passwort falsch');
    btn.disabled = false; btn.textContent = 'Anmelden';
  }
}

// ---------- Bootstrap nach Login ----------
async function bootstrapAfterLogin() {
  try {
    profile = await api('/api/me');
    me = profile.number;

    if (!profile.name) {
      const name = prompt('Wie soll dein Name sein?', 'Anon') || 'Anon';
      await api('/api/profile', { method: 'POST', body: JSON.stringify({ name }) });
      profile.name = name;
    }

    connectSocket();
    await loadChats();
    renderChatList();
  } catch (e) {
    if (e.status === 401) { logout(); return; }
    toast('Fehler beim Laden: ' + e.message);
  }
}

function connectSocket() {
  if (socket) socket.disconnect();
  socket = io({ auth: { token } });
  socket.on('message', (msg) => {
    const key = [msg.from, msg.to].sort().join('|');
    chatMessages[key] = chatMessages[key] || [];
    if (!chatMessages[key].some(m => m.ts === msg.ts && m.from === msg.from)) {
      chatMessages[key].push(msg);
    }
    if (currentPeer && (msg.from === currentPeer || msg.to === currentPeer)) {
      renderChat();
    } else {
      loadChats().then(renderChatList);
    }
  });
  socket.on('connect_error', () => toast('Socket-Verbindung fehlgeschlagen'));
}

async function loadChats() {
  // Chats-Liste vom Server holen
  try {
    const list = await api('/api/chats');
    // Für jeden Peer die Nachrichten vorladen
    await Promise.all(list.map(c => loadMessages(c.peer)));
    // Peer-Profile laden
    await Promise.all(list.map(c => loadPeerProfile(c.peer)));
  } catch {}
}

async function loadMessages(peer) {
  const key = [me, peer].sort().join('|');
  try {
    const msgs = await api('/api/messages/' + encodeURIComponent(peer));
    chatMessages[key] = msgs;
  } catch {}
}

async function loadPeerProfile(peer) {
  if (peerProfiles[peer]) return;
  try {
    const p = await api('/api/user/' + encodeURIComponent(peer));
    peerProfiles[peer] = p;
  } catch {}
}

// ---------- Chat-Liste ----------
async function renderChatList() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  app.appendChild(el('header', {}, [
    avatarFor(profile?.name || me, 36, profile?.picture),
    el('div', { class: 'title' }, 'WhatsApp'),
    el('div', { class: 'actions' }, [
      el('button', { onclick: newChat, title: 'Neuer Chat' }, '✎'),
      el('button', { onclick: renderSettings, title: 'Einstellungen' }, '⋮')
    ])
  ]));

  const list = el('div', { class: 'chatlist' });

  // Peers aus geladenen Nachrichten
  const allPeers = new Set();
  for (const key of Object.keys(chatMessages)) {
    const [a, b] = key.split('|');
    if (a !== me) allPeers.add(a);
    if (b !== me) allPeers.add(b);
  }

  if (allPeers.size === 0) {
    list.appendChild(el('div', { class: 'empty' }, [
      el('div', { class: 'icon' }, '💬'),
      el('div', {}, 'Noch keine Chats.'),
      el('div', {}, 'Tippe auf ✎ um eine Nummer anzuschreiben.')
    ]));
  } else {
    const arr = [...allPeers].map(p => {
      const key = [me, p].sort().join('|');
      const msgs = chatMessages[key] || [];
      return { peer: p, last: msgs[msgs.length - 1] };
    }).sort((a, b) => (b.last?.ts || 0) - (a.last?.ts || 0));

    for (const { peer, last } of arr) {
      const pp = peerProfiles[peer] || {};
      const displayName = pp.name || peer;
      list.appendChild(el('div', { class: 'chatitem', onclick: () => openChat(peer) }, [
        avatarFor(displayName, 48, pp.picture),
        el('div', { class: 'info' }, [
          el('div', { class: 'name' }, displayName),
          el('div', { class: 'preview' }, last ? last.text : 'Tippe um zu chatten')
        ]),
        el('div', { class: 'meta' }, last ? fmtTime(last.ts) : '')
      ]));
    }
  }
  app.appendChild(list);
}

function newChat() {
  const modal = el('div', { class: 'modal', onclick: (e) => { if (e.target.classList.contains('modal')) modal.remove(); } }, [
    el('div', { class: 'box' }, [
      el('h2', {}, 'Neuer Chat'),
      el('p', {}, 'Nummer eingeben (+979…, +921…, +777…, +888…):'),
      el('input', { id: 'peerInput', placeholder: '+7771234567', autofocus: true, onkeydown: (e) => { if (e.key === 'Enter') submit(); } }),
      el('div', { class: 'row' }, [
        el('button', { class: 'cancel', onclick: () => modal.remove() }, 'Abbrechen'),
        el('button', { class: 'ok', onclick: submit }, 'Öffnen')
      ])
    ])
  ]);
  document.body.appendChild(modal);
  setTimeout(() => document.getElementById('peerInput')?.focus(), 50);

  function submit() {
    const v = document.getElementById('peerInput').value.trim();
    if (!v) return;
    if (v === me) { toast('Das ist deine eigene Nummer'); return; }
    modal.remove();
    openChat(v);
  }
}

// ---------- Chat ----------
async function openChat(peer) {
  currentPeer = peer;
  await loadMessages(peer);
  await loadPeerProfile(peer);
  renderChat();
}

function renderChat() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const pp = peerProfiles[currentPeer] || {};
  const displayName = pp.name || currentPeer;

  app.appendChild(el('header', {}, [
    el('button', { class: 'back', onclick: backToList }, '←'),
    avatarFor(displayName, 36, pp.picture),
    el('div', { class: 'title' }, [
      el('div', {}, displayName),
      el('div', { class: 'sub' }, currentPeer)
    ]),
    el('div', { class: 'actions' }, [
      el('button', { onclick: () => toast('Nummer: ' + currentPeer) }, '⋮')
    ])
  ]));

  const view = el('div', { class: 'chatview' });
  const messages = el('div', { class: 'messages', id: 'messages' });
  view.appendChild(messages);

  const composer = el('div', { class: 'composer' }, [
    el('input', { id: 'composerInput', placeholder: 'Nachricht', autocomplete: 'off',
      onkeydown: (e) => { if (e.key === 'Enter') sendMessage(); } }),
    el('button', { onclick: sendMessage }, '➤')
  ]);
  view.appendChild(composer);
  app.appendChild(view);

  const key = [me, currentPeer].sort().join('|');
  const msgs = chatMessages[key] || [];
  for (const m of msgs) {
    const out = m.from === me;
    messages.appendChild(el('div', { class: 'msg ' + (out ? 'out' : 'in') }, [
      el('div', {}, m.text),
      el('div', { class: 'time' }, [
        fmtTime(m.ts),
        out ? el('span', { class: 'tick' }, '✓✓') : null
      ])
    ]));
  }
  messages.scrollTop = messages.scrollHeight;
  setTimeout(() => document.getElementById('composerInput')?.focus(), 50);
}

function sendMessage() {
  const input = document.getElementById('composerInput');
  const text = input.value.trim();
  if (!text || !currentPeer) return;
  socket.emit('message', { to: currentPeer, text });
  input.value = '';
  input.focus();
}

function backToList() {
  currentPeer = null;
  loadChats().then(renderChatList);
}

// ---------- Settings ----------
function renderSettings() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el('header', {}, [
    el('button', { class: 'back', onclick: backToList }, '←'),
    el('div', { class: 'title' }, 'Einstellungen')
  ]));

  const wrap = el('div', { class: 'settings' });

  // Profil
  const picBox = el('div', { class: 'profile-pic', onclick: () => document.getElementById('picInput').click() });
  if (profile.picture) picBox.appendChild(el('img', { src: profile.picture, alt: '' }));
  else picBox.textContent = (profile.name || me || '').replace(/[^\d]/g, '').slice(-2) || '??';
  picBox.appendChild(el('div', { class: 'cam' }, '📷'));

  wrap.appendChild(el('div', { class: 'section' }, [
    el('h3', {}, 'Profil'),
    el('div', { class: 'profile-row' }, [
      picBox,
      el('div', { style: 'flex:1' }, [
        el('div', { style: 'font-weight:600;font-size:16px;color:var(--wa-text)' }, profile.name || 'Kein Name'),
        el('div', { style: 'color:var(--wa-meta);font-size:13px;margin-top:2px' }, profile.status || '')
      ])
    ]),
    el('input', { type: 'file', id: 'picInput', accept: 'image/*', style: 'display:none', onchange: onPicChange }),
    el('div', { class: 'field', style: 'margin-top:16px' }, [
      el('label', {}, 'Name'),
      el('input', { id: 'nameInput', value: profile.name || '', placeholder: 'Dein Name', maxlength: 40 })
    ]),
    el('div', { class: 'field' }, [
      el('label', {}, 'Status'),
      el('input', { id: 'statusInput', value: profile.status || '', placeholder: 'Hey!', maxlength: 80 })
    ]),
    el('div', { class: 'btn-row', style: 'justify-content:flex-start' }, [
      el('button', { class: 'btn', onclick: saveProfileSettings }, 'Speichern')
    ])
  ]));

  // Nummer
  wrap.appendChild(el('div', { class: 'section' }, [
    el('h3', {}, 'Deine Nummer'),
    el('div', { class: 'field' }, [
      el('label', {}, 'Zugewiesen'),
      el('div', { class: 'value' }, me || '—')
    ]),
    el('div', { class: 'hint' }, 'Mit dieser Nummer und deinem Passwort loggst du dich überall ein.')
  ]));

  // Ban-Check
  wrap.appendChild(el('div', { class: 'section' }, [
    el('h3', {}, 'Nummern-Check'),
    el('div', { class: 'hint', style: 'margin-bottom:12px' }, 'Prüfe, ob eine beliebige Nummer bei WhatsApp gebannt ist.'),
    el('div', { class: 'check-row' }, [
      el('input', { id: 'checkInput', placeholder: '+212 707-102555' }),
      el('button', { class: 'btn', onclick: runBanCheck, id: 'checkBtn' }, 'Prüfen')
    ]),
    el('div', { class: 'check-result', id: 'checkResult' })
  ]));

  // Account
  wrap.appendChild(el('div', { class: 'section' }, [
    el('h3', {}, 'Account'),
    el('div', { class: 'hint', style: 'margin-bottom:12px' }, 'Abmelden entfernt nur dein Token auf diesem Gerät. Deine Daten bleiben auf dem Server.'),
    el('div', { class: 'btn-row', style: 'justify-content:flex-start' }, [
      el('button', { class: 'btn', style: 'background:#c62828', onclick: logout }, 'Abmelden')
    ])
  ]));

  app.appendChild(wrap);
  setTimeout(() => {
    document.getElementById('checkInput')?.addEventListener('keydown', e => { if (e.key === 'Enter') runBanCheck(); });
  }, 50);
}

function onPicChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  // Downscale auf max 240px, damit users.json nicht explodiert
  const img = new Image();
  const reader = new FileReader();
  reader.onload = ev => {
    img.onload = () => {
      const max = 240;
      const ratio = Math.min(max / img.width, max / img.height, 1);
      const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      profile.picture = c.toDataURL('image/jpeg', 0.82);
      renderSettings();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveProfileSettings() {
  const name = document.getElementById('nameInput').value.trim() || 'Anon';
  const status = document.getElementById('statusInput').value.trim();
  try {
    await api('/api/profile', { method: 'POST', body: JSON.stringify({ name, status, picture: profile.picture }) });
    profile.name = name; profile.status = status;
    toast('Profil gespeichert');
    renderSettings();
  } catch (e) {
    toast('Speichern fehlgeschlagen');
  }
}

async function runBanCheck() {
  const input = document.getElementById('checkInput');
  const result = document.getElementById('checkResult');
  const btn = document.getElementById('checkBtn');
  const raw = input.value.trim();
  if (!raw) { toast('Nummer eingeben'); return; }

  btn.disabled = true; btn.textContent = 'Prüfe…';
  result.className = 'check-result show info';
  result.textContent = 'Frage API ab…';

  try {
    const res = await fetch('/api/check/' + encodeURIComponent(raw));
    const data = await res.json();
    if (data.banned) {
      result.className = 'check-result';
      result.textContent = '';
      showBanModal(raw, {
        onCancel: () => {},
        onSupport: () => toast('Support: support@whatsapp.com')
      });
    } else if (data.status && data.status !== 200) {
      result.className = 'check-result show info';
      result.textContent = 'API-Status: ' + data.status + ' — keine eindeutige Antwort.';
    } else {
      result.className = 'check-result show ok';
      result.innerHTML = '✓ <strong>' + escapeHtml(raw) + '</strong> ist frei.';
    }
  } catch (e) {
    result.className = 'check-result show info';
    result.textContent = 'Fehler: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Prüfen';
  }
}

function logout() {
  api('/api/logout', { method: 'POST' }).catch(() => {});
  if (socket) { socket.disconnect(); socket = null; }
  localStorage.removeItem('oldwhats_token');
  token = null; me = null; profile = null;
  chatMessages = {}; peerProfiles = {}; currentPeer = null;
  renderAuth('login');
}

// ---------- Boot ----------
(async function boot() {
  if (!token) { renderAuth('register'); return; }
  try {
    profile = await api('/api/me');
    me = profile.number;
    connectSocket();
    await loadChats();
    renderChatList();
  } catch (e) {
    if (e.status === 401) { localStorage.removeItem('oldwhats_token'); token = null; renderAuth('login'); }
    else { toast('Fehler: ' + e.message); renderAuth('login'); }
  }
})();
</script>
</body>
</html>
