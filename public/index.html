<!-- language: HTML/CSS/JS, file: public/index.html, target: mobile + desktop -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OldWhats</title>
<style>
  /* ---------- ALTES WHATSAPP LOOK ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Roboto', Arial, sans-serif; background: #ece5dd; }
  :root {
    --wa-green: #075e54;
    --wa-green-light: #128c7e;
    --wa-bubble-out: #dcf8c6;
    --wa-bubble-in: #ffffff;
    --wa-bg: #ece5dd;
    --wa-header: #075e54;
    --wa-text: #111;
    --wa-meta: #667781;
  }

  .app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 100%; margin: 0 auto;
    background: var(--wa-bg);
  }
  @media (min-width: 768px) { .app { max-width: 900px; box-shadow: 0 0 20px rgba(0,0,0,.2); } }

  /* Header */
  header {
    background: var(--wa-green);
    color: #fff;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    font-size: 18px; font-weight: 500;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #128c7e; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  header .title { flex: 1; }
  header button {
    background: transparent; border: 0; color: #fff;
    font-size: 20px; cursor: pointer; padding: 4px 8px;
  }

  /* Setup screen */
  .setup {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px; text-align: center;
  }
  .setup h1 { color: var(--wa-green); font-size: 28px; margin-bottom: 8px; }
  .setup p { color: var(--wa-meta); margin-bottom: 24px; }
  .setup .num {
    font-size: 22px; font-weight: 700; color: var(--wa-text);
    padding: 16px 24px; background: #fff; border: 2px solid var(--wa-green);
    border-radius: 8px; margin-bottom: 16px; letter-spacing: 1px;
  }
  .btn {
    background: var(--wa-green); color: #fff; border: 0;
    padding: 12px 24px; border-radius: 6px; font-size: 16px;
    cursor: pointer; margin: 4px;
  }
  .btn.secondary { background: var(--wa-green-light); }
  .btn:active { background: #054d44; }

  /* Chat list */
  .chatlist { flex: 1; overflow-y: auto; background: #fff; }
  .chatlist .empty { padding: 40px; text-align: center; color: var(--wa-meta); }
  .chatitem {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid #e9edef; cursor: pointer;
  }
  .chatitem:hover { background: #f5f5f5; }
  .chatitem .avatar {
    width: 48px; height: 48px; border-radius: 50%; background: #128c7e;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .chatitem .info { flex: 1; min-width: 0; }
  .chatitem .name { font-weight: 500; color: var(--wa-text); }
  .chatitem .preview {
    color: var(--wa-meta); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chatitem .meta { color: var(--wa-meta); font-size: 12px; text-align: right; }

  /* Chat view */
  .chatview { flex: 1; display: flex; flex-direction: column; background: var(--wa-bg); }
  .messages { flex: 1; overflow-y: auto; padding: 12px; }
  .msg {
    max-width: 75%; padding: 8px 12px; margin-bottom: 6px;
    border-radius: 8px; font-size: 15px; line-height: 1.35;
    word-wrap: break-word; position: relative;
  }
  .msg.out {
    background: var(--wa-bubble-out); margin-left: auto;
    border-top-right-radius: 0;
  }
  .msg.in {
    background: var(--wa-bubble-in); margin-right: auto;
    border-top-left-radius: 0;
  }
  .msg .time { font-size: 11px; color: var(--wa-meta); text-align: right; margin-top: 2px; }
  .composer {
    display: flex; gap: 8px; padding: 8px; background: #f0f0f0;
    border-top: 1px solid #ddd;
  }
  .composer input {
    flex: 1; padding: 10px 14px; border: 0; border-radius: 20px;
    font-size: 15px; outline: none;
  }
  .composer button {
    background: var(--wa-green); color: #fff; border: 0;
    border-radius: 50%; width: 42px; height: 42px; font-size: 18px;
    cursor: pointer;
  }

  /* Modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal .box {
    background: #fff; border-radius: 8px; padding: 24px;
    max-width: 360px; width: 90%; text-align: center;
  }
  .modal .box h2 { color: #d32f2f; margin-bottom: 12px; font-size: 18px; }
  .modal .box p { color: var(--wa-text); margin-bottom: 20px; line-height: 1.5; }
  .modal .box .row { display: flex; gap: 8px; justify-content: center; }

  /* Ban result */
  .banresult { margin-top: 12px; font-size: 14px; }
  .banresult.banned { color: #d32f2f; font-weight: 700; }
  .banresult.ok { color: var(--wa-green); font-weight: 700; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ---------- State ----------
let me = localStorage.getItem('oldwhats_me') || null;
let socket = null;
let currentPeer = null;
let chatMessages = {};

// ---------- Helpers ----------
function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'onclick') e.onclick = v;
    else if (k.startsWith('data-')) e.setAttribute(k, v);
    else e[k] = v;
  }
  for (const c of [].concat(children)) {
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  }
  return e;
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function initials(num) { return num.replace(/[^\d]/g, '').slice(-2); }

// ---------- Render: Setup ----------
function renderSetup() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = el('div', { class: 'setup' }, [
    el('h1', {}, 'OldWhats'),
    el('p', {}, 'Eine Nummer wird dir zugewiesen. Du kannst sie rerolen.'),
    el('div', { class: 'num', id: 'numDisplay' }, '…'),
    el('button', { class: 'btn', onclick: rollNumber }, 'Neue Nummer ziehen'),
    el('button', { class: 'btn secondary', id: 'enterBtn', onclick: enterApp, style: 'display:none' }, 'Weiter'),
    el('div', { class: 'banresult', id: 'banResult' })
  ]);
  app.appendChild(wrap);
  rollNumber();
}

async function rollNumber() {
  const display = document.getElementById('numDisplay');
  display.textContent = '…';
  document.getElementById('enterBtn').style.display = 'none';
  document.getElementById('banResult').textContent = '';
  const res = await fetch('/api/register', { method: 'POST' });
  const data = await res.json();
  display.textContent = data.number;
  me = data.number;
  localStorage.setItem('oldwhats_me', me);
  document.getElementById('enterBtn').style.display = 'inline-block';
  // Ban-Check
  const banRes = await fetch('/api/check/' + encodeURIComponent(me));
  const ban = await banRes.json();
  const br = document.getElementById('banResult');
  if (ban.banned) {
    br.className = 'banresult banned';
    br.textContent = 'Diese Nummer ist gebannt. Bitte neue ziehen.';
    document.getElementById('enterBtn').style.display = 'none';
  } else if (ban.status && ban.status !== 200) {
    br.className = 'banresult';
    br.textContent = 'Ban-API antwortet mit Status ' + ban.status + ' (evtl. IP-Block).';
  } else {
    br.className = 'banresult ok';
    br.textContent = 'Nummer frei.';
  }
}

function enterApp() {
  if (!me) return;
  if (!socket) {
    socket = io();
    socket.on('connect', () => socket.emit('join', me));
    socket.on('message', (msg) => {
      const key = [msg.from, msg.to].sort().join('|');
      chatMessages[key] = chatMessages[key] || [];
      // Duplikate vermeiden
      if (!chatMessages[key].some(m => m.ts === msg.ts && m.from === msg.from)) {
        chatMessages[key].push(msg);
      }
      if (currentPeer && [msg.from, msg.to].includes(currentPeer)) {
        renderChat();
      } else {
        renderChatList();
      }
    });
  }
  renderChatList();
  if (!currentPeer) {
    // Standard: erster Chat oder Hinweis
    renderChatList();
  }
}

// ---------- Render: Chat list ----------
function renderChatList() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const header = el('header', {}, [
    el('div', { class: 'avatar' }, initials(me)),
    el('div', { class: 'title' }, 'OldWhats — ' + me),
    el('button', { onclick: newChat, title: 'Neuer Chat' }, '+')
  ]);
  app.appendChild(header);

  const list = el('div', { class: 'chatlist' });
  const peers = new Set();
  for (const key of Object.keys(chatMessages)) {
    const [a, b] = key.split('|');
    if (a !== me) peers.add(a);
    if (b !== me) peers.add(b);
  }
  if (peers.size === 0) {
    list.appendChild(el('div', { class: 'empty' }, 'Noch keine Chats. Tippe + um eine Nummer anzuschreiben.'));
  } else {
    for (const peer of peers) {
      const key = [me, peer].sort().join('|');
      const msgs = chatMessages[key] || [];
      const last = msgs[msgs.length - 1];
      list.appendChild(el('div', { class: 'chatitem', onclick: () => openChat(peer) }, [
        el('div', { class: 'avatar' }, initials(peer)),
        el('div', { class: 'info' }, [
          el('div', { class: 'name' }, peer),
          el('div', { class: 'preview' }, last ? last.text : 'Neuer Chat')
        ]),
        last ? el('div', { class: 'meta' }, fmtTime(last.ts)) : null
      ]));
    }
  }
  app.appendChild(list);
}

function newChat() {
  const peer = prompt('Nummer eingeben (+979…, +921…, +777…, +888…):');
  if (!peer) return;
  openChat(peer.trim());
}

// ---------- Render: Chat ----------
function openChat(peer) {
  currentPeer = peer;
  const key = [me, peer].sort().join('|');
  fetch('/api/messages/' + encodeURIComponent(me) + '/' + encodeURIComponent(peer))
    .then(r => r.json())
    .then(msgs => { chatMessages[key] = msgs; renderChat(); });
}

function renderChat() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const header = el('header', {}, [
    el('button', { onclick: backToList }, '←'),
    el('div', { class: 'avatar' }, initials(currentPeer)),
    el('div', { class: 'title' }, currentPeer)
  ]);
  app.appendChild(header);

  const view = el('div', { class: 'chatview' });
  const messages = el('div', { class: 'messages', id: 'messages' });
  view.appendChild(messages);

  const composer = el('div', { class: 'composer' }, [
    el('input', { id: 'composerInput', placeholder: 'Nachricht', onkeydown: (e) => {
      if (e.key === 'Enter') sendMessage();
    }}),
    el('button', { onclick: sendMessage }, '➤')
  ]);
  view.appendChild(composer);
  app.appendChild(view);

  const key = [me, currentPeer].sort().join('|');
  const msgs = chatMessages[key] || [];
  for (const m of msgs) {
    const out = m.from === me;
    messages.appendChild(el('div', { class: 'msg ' + (out ? 'out' : 'in') }, [
      el('div', {}, m.text),
      el('div', { class: 'time' }, fmtTime(m.ts))
    ]));
  }
  messages.scrollTop = messages.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('composerInput');
  const text = input.value.trim();
  if (!text || !currentPeer) return;
  socket.emit('message', { me, to: currentPeer, text });
  input.value = '';
}

function backToList() {
  currentPeer = null;
  renderChatList();
}

// ---------- Boot ----------
if (me) {
  enterApp();
} else {
  renderSetup();
}
</script>
</body>
</html>
